name: Configure native quota repository policy

on:
  workflow_dispatch:

permissions: {}

jobs:
  rules:
    name: Protect stable release lines
    if: github.repository != 'surrealdb/surrealdb'
    runs-on: ubuntu-latest
    environment: native-quota-repository-admin
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Mint repository administration token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.REPOSITORY_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPOSITORY_POLICY_APP_PRIVATE_KEY }}

      - name: Apply and verify release-line ruleset
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/native-quota/configure_repository_ruleset.sh
