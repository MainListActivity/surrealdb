name: Propose weekly upstream sync

run-name: "Propose surrealdb/surrealdb main sync"

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: native-quota-upstream-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  propose:
    name: Open reviewable upstream sync PR
    if: github.repository != 'surrealdb/surrealdb'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch official upstream through a permanently read-only remote
        id: upstream
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/surrealdb/surrealdb.git
          git remote set-url --push upstream no_push
          test "$(git remote get-url --push upstream)" = "no_push"
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse upstream/main)"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${upstream_sha:0:12}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into a proposal branch
        id: merge
        if: steps.upstream.outputs.changed == 'true'
        env:
          BRANCH: automation/upstream-sync-${{ steps.upstream.outputs.short_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "Proposal branch $BRANCH already exists; reusing it without rewriting history."
            exit 0
          fi
          git switch -c "$BRANCH"
          if ! git merge --no-ff --no-edit upstream/main; then
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          git push --set-upstream origin "$BRANCH"

      - name: Open sync pull request
        if: steps.upstream.outputs.changed == 'true' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: automation/upstream-sync-${{ steps.upstream.outputs.short_sha }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "Existing sync PR: $existing"
            exit 0
          fi
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "chore: sync upstream main at ${UPSTREAM_SHA:0:12}" \
            --body "Reviewable weekly merge from the read-only official upstream at \`${UPSTREAM_SHA}\`. This workflow never pushes to the upstream remote and never merges this PR automatically. Native quota CI and release gates must pass before merge."

      - name: Open conflict issue instead of mutating main
        if: steps.upstream.outputs.changed == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Upstream sync conflict at ${UPSTREAM_SHA:0:12}"
          existing="$(gh issue list --state open --search "$title in:title" --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "Existing conflict issue: $existing"
            exit 0
          fi
          gh issue create \
            --title "$title" \
            --body "The read-only weekly upstream merge conflicted and did not push any branch or mutate main. Resolve it manually and run the full native quota gates. Run: $RUN_URL"
