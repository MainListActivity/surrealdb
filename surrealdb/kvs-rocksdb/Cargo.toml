rocksdb = { version = "=0.24.0-surreal.5", package = "surrealdb-rocksdb", features = ["lz4", "snappy"] }
surrealdb-cnf.workspace = true
surrealdb-kvs.workspace = true
surrealdb-kvs-any.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "time"] }
