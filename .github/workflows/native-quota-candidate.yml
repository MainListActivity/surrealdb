name: Native quota release candidate

run-name: "Native quota candidate ${{ github.event.workflow_run.head_sha || inputs.git_ref }}"

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact commit or releases/sck-* ref to certify
        required: true
        type: string
        default: releases/sck-3.3

concurrency:
  group: native-quota-candidate-${{ github.event.workflow_run.head_sha || inputs.git_ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  source-gate:
    name: Verify protected source and upstream CI
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && startsWith(github.event.workflow_run.head_branch, 'releases/sck-'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      git_sha: ${{ steps.metadata.outputs.git_sha }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      release: ${{ steps.metadata.outputs.release }}
      manifest_revision: ${{ steps.metadata.outputs.manifest_revision }}
      stable_branch: ${{ steps.metadata.outputs.stable_branch }}
      image_repository: ${{ steps.metadata.outputs.image_repository }}
      candidate_tag: ${{ steps.metadata.outputs.candidate_tag }}
      ci_run_url: ${{ steps.metadata.outputs.ci_run_url }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.git_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release line and successful exact-SHA CI
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          release="$(jq -er '.fork_release' compatibility/native-quota-v1.json)"
          revision="$(jq -er '.manifest_revision' compatibility/native-quota-v1.json)"
          stable_branch="$(jq -er '.release_supply_chain.stable_branch' compatibility/native-quota-v1.json)"
          image="$(jq -er '.release_supply_chain.image_repository' compatibility/native-quota-v1.json)"
          expected_line="releases/sck-$(printf '%s' "$release" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')"

          test "$stable_branch" = "$expected_line"
          test "$image" = "ghcr.io/mainlistactivity/surrealdb-native-quota"
          case "$image" in
            *surrealdb/surrealdb*) echo "::error::official image namespace is forbidden"; exit 1 ;;
          esac

          git fetch --no-tags origin "refs/heads/${stable_branch}:refs/remotes/origin/${stable_branch}"
          git merge-base --is-ancestor "$sha" "origin/${stable_branch}" || {
            echo "::error::candidate $sha is not on protected release line $stable_branch"
            exit 1
          }

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            test "$WORKFLOW_HEAD_BRANCH" = "$stable_branch"
            ci_run_url="$WORKFLOW_RUN_URL"
          else
            runs="$(gh api \
              "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=completed&per_page=100")"
            ci_run_url="$(jq -er \
              --arg branch "$stable_branch" \
              '[.workflow_runs[] | select(.head_branch == $branch and .conclusion == "success")] | first | .html_url' \
              <<<"$runs")" || {
                echo "::error::no successful CI run exists for exact SHA $sha on $stable_branch"
                exit 1
              }
          fi

          short_sha="${sha:0:12}"
          candidate_tag="sck-${release}-candidate.${GITHUB_RUN_NUMBER}"
          {
            echo "git_sha=$sha"
            echo "short_sha=$short_sha"
            echo "release=$release"
            echo "manifest_revision=$revision"
            echo "stable_branch=$stable_branch"
            echo "image_repository=$image"
            echo "candidate_tag=$candidate_tag"
            echo "ci_run_url=$ci_run_url"
          } >> "$GITHUB_OUTPUT"

  contract-gates:
    name: Capability, formats, and release contracts
    needs: source-gate
    runs-on: ${{ github.repository == 'surrealdb/surrealdb' && 'runner-arm-16-cores' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source-gate.outputs.git_sha }}
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          save-cache: false

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          preset: test

      - name: Validate compatibility and capability contracts
        run: |
          set -euo pipefail
          python3 -m unittest scripts/native-quota/test_release_manifest.py
          cargo test -p surrealdb-server capability::tests --lib
          jq -e '
            .fork_release == .cli.release
            and .release_supply_chain.production_reference == "digest-only"
            and .release_supply_chain.image_repository != .release_supply_chain.nightly_image_repository
            and any(.backends[]; .production == true and .hard_quota_certified == true)
            and .support.previous_production_line_days >= 90
            and .mixed_version.data_format_downgrade_supported == false
          ' compatibility/native-quota-v1.json >/dev/null

  backend-gates:
    name: Hard quota backend contracts (${{ matrix.backend }})
    needs: source-gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: memory
            feature: kv-mem
            module: mem
            runner: ${{ github.repository == 'surrealdb/surrealdb' && 'runner-arm-16-cores' || 'ubuntu-24.04-arm' }}
          - backend: rocksdb
            feature: kv-rocksdb
            module: rocksdb
            runner: ${{ github.repository == 'surrealdb/surrealdb' && 'runner-amd-32-cores' || 'ubuntu-24.04' }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source-gate.outputs.git_sha }}
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          save-cache: false

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          preset: test

      - name: Prove backend contract tests are discoverable
        env:
          FEATURE: ${{ matrix.feature }}
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          prefix="kvs::tests::${MODULE}::quota_"
          tests="$(cargo test -p surrealdb-core \
            --no-default-features \
            --features "$FEATURE" \
            --lib \
            -- --list)"
          count="$(grep -c "^${prefix}.*: test$" <<<"$tests" || true)"
          test "$count" -ge 5 || {
            echo "::error::expected at least five generated quota backend contracts, found $count"
            exit 1
          }

      - name: Run backend-neutral and persistence contracts
        env:
          FEATURE: ${{ matrix.feature }}
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          cargo test -p surrealdb-core \
            --no-default-features \
            --features "$FEATURE" \
            --lib \
            "kvs::tests::${MODULE}::quota_" \
            -- --test-threads=1

      - name: Run RocksDB crash/restart certification
        if: matrix.backend == 'rocksdb'
        run: >-
          cargo test -p surrealdb-core
          --no-default-features
          --features kv-rocksdb
          quota_rocksdb_certification
          -- --test-threads=1

  performance-gate:
    name: RocksDB quota regression gate
    needs: source-gate
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source-gate.outputs.git_sha }}
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          save-cache: false

      - name: Compare fixed-workload benchmark with release baseline
        run: |
          set -euo pipefail
          benchmark=(
            cargo bench -p surrealdb-core --bench quota --features kv-rocksdb --
            --baseline ../../compatibility/native-quota-rocksdb-v1.json
            --output ../../target/native-quota-benchmark.json
          )
          attempt=1
          while [ "$attempt" -le 3 ]; do
            log="$RUNNER_TEMP/native-quota-benchmark-$attempt.log"
            set +e
            "${benchmark[@]}" 2>&1 | tee "$log"
            exit_code=${PIPESTATUS[0]}
            set -e
            if [ "$exit_code" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eq "normalized (throughput|p(95|99) latency) regressed beyond" "$log"; then
              exit "$exit_code"
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$exit_code"
            fi
            next_attempt=$((attempt + 1))
            echo "The fixed-workload gate failed only on throughput/p95/p99 performance; rerunning the warmed benchmark (attempt $next_attempt/3) to distinguish runner noise from a repeatable regression."
            rm -f target/native-quota-benchmark.json
            attempt="$next_attempt"
          done

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-quota-benchmark-${{ needs.source-gate.outputs.short_sha }}
          path: target/native-quota-benchmark.json
          retention-days: 90

  build-cli:
    name: Build matching CLI (${{ matrix.platform }})
    needs:
      - source-gate
      - contract-gates
      - backend-gates
      - performance-gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-unknown-linux-gnu
            platform: amd64
            runner: ${{ github.repository == 'surrealdb/surrealdb' && 'runner-amd-32-cores' || 'ubuntu-24.04' }}
          - arch: aarch64-unknown-linux-gnu
            platform: arm64
            runner: ${{ github.repository == 'surrealdb/surrealdb' && 'runner-arm-32-cores' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source-gate.outputs.git_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build release CLI once
        uses: ./.github/actions/build-linux
        with:
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          name: native-quota
          version-override: ${{ needs.source-gate.outputs.release }}
          build-metadata: sha.${{ needs.source-gate.outputs.short_sha }}
          git-sha: ${{ needs.source-gate.outputs.git_sha }}
          extra-features: jwks,ml
          upload: true
          release: true
          profile: release-thin

  publish-candidate:
    name: Publish signed multi-arch candidate
    needs:
      - source-gate
      - build-cli
    runs-on: ubuntu-latest
    environment: native-quota-candidate
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source-gate.outputs.git_sha }}
          persist-credentials: false

      - name: Download matching CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: surreal-native-quota.linux-*
          path: artifacts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to fork GHCR namespace
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable image state without overwriting
        id: immutable
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.source-gate.outputs.image_repository }}
          RELEASE: ${{ needs.source-gate.outputs.release }}
          SHA: ${{ needs.source-gate.outputs.git_sha }}
          CANDIDATE_TAG: ${{ needs.source-gate.outputs.candidate_tag }}
          CANDIDATE_IMAGE_TAG: candidate-${{ needs.source-gate.outputs.git_sha }}
        run: |
          set -euo pipefail
          if gh release view "$CANDIDATE_TAG" >/dev/null 2>&1; then
            echo "::error::candidate release already exists: $CANDIDATE_TAG"
            exit 1
          fi
          release_exists=false
          sha_exists=false
          docker buildx imagetools inspect "$IMAGE:$RELEASE" >/dev/null 2>&1 && release_exists=true
          docker buildx imagetools inspect "$IMAGE:sha-$SHA" >/dev/null 2>&1 && sha_exists=true
          if [ "$release_exists" != "$sha_exists" ]; then
            echo "::error::partial immutable tag state requires operator investigation"
            exit 1
          fi
          if [ "$release_exists" = "true" ]; then
            release_digest="sha256:$(docker buildx imagetools inspect "$IMAGE:$RELEASE" --raw | sha256sum | cut -d' ' -f1)"
            sha_digest="sha256:$(docker buildx imagetools inspect "$IMAGE:sha-$SHA" --raw | sha256sum | cut -d' ' -f1)"
            test "$release_digest" = "$sha_digest" || {
              echo "::error::immutable release and SHA tags resolve to different digests"
              exit 1
            }
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "fixed_reuse=true" >> "$GITHUB_OUTPUT"
            echo "digest=$release_digest" >> "$GITHUB_OUTPUT"
            echo "Reusing already-built immutable digest $release_digest after an interrupted candidate run."
          elif docker buildx imagetools inspect "$IMAGE:$CANDIDATE_IMAGE_TAG" >/dev/null 2>&1; then
            candidate_digest="sha256:$(docker buildx imagetools inspect "$IMAGE:$CANDIDATE_IMAGE_TAG" --raw | sha256sum | cut -d' ' -f1)"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "fixed_reuse=false" >> "$GITHUB_OUTPUT"
            echo "digest=$candidate_digest" >> "$GITHUB_OUTPUT"
            echo "Reusing candidate image $IMAGE:$CANDIDATE_IMAGE_TAG after an interrupted validation run."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "fixed_reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image exactly once
        if: steps.immutable.outputs.reuse != 'true'
        id: image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: artifacts
          file: ./docker/Dockerfile
          target: prod-ci
          platforms: linux/amd64,linux/arm64
          build-args: ARTIFACT_PREFIX=surreal-native-quota
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ needs.source-gate.outputs.image_repository }}:candidate-${{ needs.source-gate.outputs.git_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.source-gate.outputs.git_sha }}
            org.opencontainers.image.version=${{ needs.source-gate.outputs.release }}
            org.opencontainers.image.vendor=MainListActivity
            io.mainlistactivity.surrealdb.fork=mainlistactivity/surrealdb-native-quota
            io.mainlistactivity.surrealdb.fork-release=${{ needs.source-gate.outputs.release }}
            io.mainlistactivity.surrealdb.manifest-revision=${{ needs.source-gate.outputs.manifest_revision }}
            io.mainlistactivity.surrealdb.quota-contract=native-quota-v1
            io.mainlistactivity.surrealdb.storage-format=1
            io.mainlistactivity.surrealdb.quota-catalog-format=1
            io.mainlistactivity.surrealdb.quota-usage-format=1
            io.mainlistactivity.surrealdb.channel=candidate

      - name: Resolve the once-built digest
        id: final-image
        env:
          REUSED: ${{ steps.immutable.outputs.reuse }}
          REUSED_DIGEST: ${{ steps.immutable.outputs.digest }}
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$REUSED" = "true" ]; then
            digest="$REUSED_DIGEST"
          else
            digest="$BUILT_DIGEST"
          fi
          case "$digest" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo "::error::invalid resolved image digest"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign and verify the immutable image digest
        env:
          IMAGE: ${{ needs.source-gate.outputs.image_repository }}
          DIGEST: ${{ steps.final-image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-identity-regexp "^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/native-quota-candidate\\.yml@refs/heads/(main|releases/sck-[0-9]+\\.[0-9]+)$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE@$DIGEST" > image-signature-verification.json

      - name: Generate standalone SPDX SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: ${{ needs.source-gate.outputs.image_repository }}@${{ steps.final-image.outputs.digest }}
          format: spdx-json
          output-file: native-quota-image.spdx.json
          artifact-name: native-quota-image-sbom
          upload-artifact: false

      - name: Download BuildKit provenance
        env:
          IMAGE: ${{ needs.source-gate.outputs.image_repository }}
          DIGEST: ${{ steps.final-image.outputs.digest }}
        run: cosign download attestation "$IMAGE@$DIGEST" > native-quota-image.provenance.intoto.jsonl

      - name: Scan immutable image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.source-gate.outputs.image_repository }}@${{ steps.final-image.outputs.digest }}
          format: json
          output: native-quota-image.vulnerabilities.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Gate high and critical vulnerabilities
        run: |
          set -euo pipefail
          count="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' native-quota-image.vulnerabilities.json)"
          test "$count" -eq 0 || {
            echo "::error::$count fixed HIGH/CRITICAL vulnerabilities found"
            exit 1
          }

      - name: Multi-architecture CLI smoke
        env:
          IMAGE: ${{ needs.source-gate.outputs.image_repository }}
          DIGEST: ${{ steps.final-image.outputs.digest }}
          RELEASE: ${{ needs.source-gate.outputs.release }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            # A Docker daemon cannot bind the same multi-arch digest reference to
            # two different platform images at once. Remove the previous local
            # binding before resolving the next platform from the manifest list.
            docker image rm --force "$IMAGE@$DIGEST" >/dev/null 2>&1 || true
            output="$(docker run --rm --platform "$platform" "$IMAGE@$DIGEST" version)"
            grep -F "$RELEASE" <<<"$output"
          done

      - name: Capture and validate image capability identity
        env:
          IMAGE: ${{ needs.source-gate.outputs.image_repository }}
          DIGEST: ${{ steps.final-image.outputs.digest }}
          RELEASE: ${{ needs.source-gate.outputs.release }}
          SHA: ${{ needs.source-gate.outputs.git_sha }}
          REVISION: ${{ needs.source-gate.outputs.manifest_revision }}
        run: |
          set -euo pipefail
          # The multi-architecture smoke leaves the canonical digest bound to
          # the last platform it resolved. Remove that local binding before
          # asking Docker to resolve the same digest for amd64.
          docker image rm --force "$IMAGE@$DIGEST" >/dev/null 2>&1 || true
          container="$(docker run --platform linux/amd64 -d -p 8000:8000 "$IMAGE@$DIGEST" \
            start --bind 0.0.0.0:8000 --log none --user root --pass root rocksdb:/data/native-quota)"
          capabilities_ready=false
          cleanup() {
            if [ "$capabilities_ready" != "true" ]; then
              docker logs "$container" || true
            fi
            docker inspect --format='exit={{.State.ExitCode}} status={{.State.Status}}' "$container" || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 180); do
            if curl --fail --silent --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:8000/capabilities > native-quota-capabilities.json; then
              capabilities_ready=true
              break
            fi
            sleep 1
          done
          test "$capabilities_ready" = "true" || {
            echo "::error::capability endpoint did not become ready within 180 seconds"
            exit 1
          }
          jq -e \
            --arg release "$RELEASE" \
            --arg sha "$SHA" \
            --arg revision "$REVISION" \
            '.fork.release == $release
             and .build.git_sha == $sha
             and .manifest_revision == $revision
             and .backend.production == true
             and .storage.ready == true' \
            native-quota-capabilities.json >/dev/null

      - name: Verify image labels
        env:
          IMAGE: ${{ needs.source-gate.outputs.image_repository }}
          DIGEST: ${{ steps.final-image.outputs.digest }}
          RELEASE: ${{ needs.source-gate.outputs.release }}
          SHA: ${{ needs.source-gate.outputs.git_sha }}
          REVISION: ${{ needs.source-gate.outputs.manifest_revision }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker inspect "$IMAGE@$DIGEST" > native-quota-image-inspect.json
          jq -e \
            --arg release "$RELEASE" \
            --arg sha "$SHA" \
            --arg revision "$REVISION" \
            '.[0].Config.Labels["org.opencontainers.image.version"] == $release
             and .[0].Config.Labels["org.opencontainers.image.revision"] == $sha
             and .[0].Config.Labels["io.mainlistactivity.surrealdb.manifest-revision"] == $revision
             and .[0].Config.Labels["io.mainlistactivity.surrealdb.channel"] == "candidate"' \
            native-quota-image-inspect.json >/dev/null

      - name: Sign matching CLI archives
        run: |
          set -euo pipefail
          while IFS= read -r archive; do
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          done < <(find artifacts -type f -name '*.tgz' -print | sort)

      - name: Render, verify, and sign candidate manifest
        env:
          IMAGE: ${{ needs.source-gate.outputs.image_repository }}
          DIGEST: ${{ steps.final-image.outputs.digest }}
          SHA: ${{ needs.source-gate.outputs.git_sha }}
          CI_RUN_URL: ${{ needs.source-gate.outputs.ci_run_url }}
        run: |
          set -euo pipefail
          python3 scripts/native-quota/release_manifest.py render \
            --compatibility compatibility/native-quota-v1.json \
            --capability native-quota-capabilities.json \
            --artifacts-dir artifacts \
            --sbom native-quota-image.spdx.json \
            --provenance native-quota-image.provenance.intoto.jsonl \
            --vulnerability-report native-quota-image.vulnerabilities.json \
            --image-signature-verification image-signature-verification.json \
            --git-sha "$SHA" \
            --image-digest "$DIGEST" \
            --repository "$IMAGE" \
            --source-repository "$GITHUB_REPOSITORY" \
            --ci-run-url "$CI_RUN_URL" \
            --output native-quota-release-candidate.json
          python3 scripts/native-quota/release_manifest.py verify \
            --candidate native-quota-release-candidate.json \
            --compatibility compatibility/native-quota-v1.json \
            --expected-sha "$SHA" \
            --expected-digest "$DIGEST"
          cosign sign-blob --yes \
            --bundle native-quota-release-candidate.sigstore.json \
            native-quota-release-candidate.json

      - name: Publish immutable image tags after validation
        env:
          IMAGE: ${{ needs.source-gate.outputs.image_repository }}
          RELEASE: ${{ needs.source-gate.outputs.release }}
          SHA: ${{ needs.source-gate.outputs.git_sha }}
          DIGEST: ${{ steps.final-image.outputs.digest }}
          FIXED_REUSE: ${{ steps.immutable.outputs.fixed_reuse }}
        run: |
          set -euo pipefail
          if [ "$FIXED_REUSE" = "true" ]; then
            echo "Immutable release and SHA tags were already present; leaving them unchanged."
            exit 0
          fi
          release_exists=false
          sha_exists=false
          docker buildx imagetools inspect "$IMAGE:$RELEASE" >/dev/null 2>&1 && release_exists=true
          docker buildx imagetools inspect "$IMAGE:sha-$SHA" >/dev/null 2>&1 && sha_exists=true
          if [ "$release_exists" = "true" ] || [ "$sha_exists" = "true" ]; then
            echo "::error::immutable release or SHA tag appeared during validation"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$IMAGE:$RELEASE" \
            --tag "$IMAGE:sha-$SHA" \
            "$IMAGE@$DIGEST"
          release_digest="sha256:$(docker buildx imagetools inspect "$IMAGE:$RELEASE" --raw | sha256sum | cut -d' ' -f1)"
          sha_digest="sha256:$(docker buildx imagetools inspect "$IMAGE:sha-$SHA" --raw | sha256sum | cut -d' ' -f1)"
          test "$release_digest" = "$DIGEST"
          test "$sha_digest" = "$DIGEST"

      - name: Publish signed GitHub pre-release last
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.source-gate.outputs.candidate_tag }}
          SHA: ${{ needs.source-gate.outputs.git_sha }}
          IMAGE: ${{ needs.source-gate.outputs.image_repository }}
          DIGEST: ${{ steps.final-image.outputs.digest }}
        run: |
          set -euo pipefail
          find artifacts -type f \( -name '*.tgz' -o -name '*.txt' -o -name '*.sigstore.json' \) -print0 |
            xargs -0 cp -t .
          gh release create "$TAG" \
            --target "$SHA" \
            --prerelease \
            --title "$TAG" \
            --notes "Signed native quota release candidate. Deploy only as \`$IMAGE@$DIGEST\`; stable promotion requires surreal_ck acceptance." \
            native-quota-release-candidate.json \
            native-quota-release-candidate.sigstore.json \
            compatibility/native-quota-v1.json \
            native-quota-capabilities.json \
            native-quota-image.spdx.json \
            native-quota-image.provenance.intoto.jsonl \
            native-quota-image.vulnerabilities.json \
            image-signature-verification.json \
            surreal-native-quota.linux-*.tgz \
            surreal-native-quota.linux-*.txt \
            surreal-native-quota.linux-*.sigstore.json

      - name: Upload release evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-quota-candidate-${{ needs.source-gate.outputs.short_sha }}
          path: |
            native-quota-release-candidate.json
            native-quota-release-candidate.sigstore.json
            compatibility/native-quota-v1.json
            native-quota-capabilities.json
            native-quota-image.spdx.json
            native-quota-image.provenance.intoto.jsonl
            native-quota-image.vulnerabilities.json
            image-signature-verification.json
            surreal-native-quota.linux-*.tgz
            surreal-native-quota.linux-*.txt
            surreal-native-quota.linux-*.sigstore.json
          retention-days: 90
